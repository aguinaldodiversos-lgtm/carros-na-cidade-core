<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Representação ilustrativa de SUV compacto Fiat Pulse">
  <defs>
    <linearGradient id="pulseBody" x1="0" x2=".38" y1="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".4" stop-color="#eaf2fb"/>
      <stop offset=".8" stop-color="#b2c8df"/>
      <stop offset="1" stop-color="#dce8f6"/>
    </linearGradient>
    <linearGradient id="pulseGlass" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#bed9ef"/>
      <stop offset=".32" stop-color="#597fa3"/>
      <stop offset="1" stop-color="#17314d"/>
    </linearGradient>
    <radialGradient id="pulseRim">
      <stop stop-color="#fff"/>
      <stop offset=".72" stop-color="#bccedf"/>
      <stop offset="1" stop-color="#657c95"/>
    </radialGradient>
    <filter id="pulseShadow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <ellipse cx="400" cy="279" rx="291" ry="14" fill="#6c8fb8" opacity=".26" filter="url(#pulseShadow)"/>
  <!-- Taller greenhouse, upright tail, short overhang and lifted stance distinguish this SUV from the Virtus sedan. -->
  <path d="M93 221Q88 188 112 177L201 152 260 142 300 69Q316 44 345 44H514Q550 44 572 65L626 138 686 157Q705 165 707 185L712 233Q710 250 687 251H111Q92 247 93 221Z" fill="url(#pulseBody)" stroke="#7d9cbd" stroke-width="3.5"/>
  <!-- Roof rails and high-roof glass. -->
  <path d="M319 45V36Q320 32 326 32H529Q535 32 536 37V45" fill="none" stroke="#7b92ad" stroke-width="5" stroke-linecap="round"/>
  <path d="M270 139 311 73Q319 59 344 59H425V139Z" fill="url(#pulseGlass)" stroke="#809db9" stroke-width="3"/>
  <path d="M440 59H510Q540 59 551 79L590 139H440Z" fill="url(#pulseGlass)" stroke="#809db9" stroke-width="3"/>
  <path d="M435 60V142M432 145V235M610 144 610 235" fill="none" stroke="#92abc6" stroke-width="3"/>
  <path d="M278 132 319 74Q324 67 347 67H419" stroke="#f8fcff" stroke-width="5" stroke-linecap="round" opacity=".72" fill="none"/>
  <!-- Shoulder line and front/rear signatures. -->
  <path d="M108 188Q380 166 690 184" stroke="#fff" stroke-width="7" fill="none" opacity=".75"/>
  <path d="M112 218H700" stroke="#7491b0" stroke-width="4" opacity=".65"/>
  <path d="M252 159H277M494 158H516" stroke="#607a97" stroke-width="5" stroke-linecap="round"/>
  <path d="M98 196 142 181 156 187 146 204 99 211Z" fill="#f2faff" stroke="#7c9fbd" stroke-width="2"/>
  <path d="M684 173 704 183 706 211 685 207Z" fill="#d44a5a"/>
  <!-- Wide plastic cladding and raised rocker panel: SUV cue. -->
  <path d="M105 229Q398 238 704 224L694 249H111Z" fill="#354b64" opacity=".76"/>
  <path d="M120 244H684" stroke="#677e99" stroke-width="5" opacity=".8"/>
  <path d="M162 255a58 58 0 0 1 116 0M521 255a58 58 0 0 1 116 0" fill="none" stroke="#506983" stroke-width="6"/>
  <g transform="translate(220 255)">
    <circle r="56" fill="#25313e"/>
    <circle r="40" fill="url(#pulseRim)" stroke="#dfe8f0" stroke-width="2"/>
    <circle r="27" fill="#536f8d"/>
    <path d="M0 -27V27M-27 0H27M-19 -19 19 19M-19 19 19 -19" stroke="#eff7ff" stroke-width="7"/>
    <circle r="9" fill="#d1e0ee"/>
  </g>
  <g transform="translate(579 255)">
    <circle r="56" fill="#25313e"/>
    <circle r="40" fill="url(#pulseRim)" stroke="#dfe8f0" stroke-width="2"/>
    <circle r="27" fill="#536f8d"/>
    <path d="M0 -27V27M-27 0H27M-19 -19 19 19M-19 19 19 -19" stroke="#eff7ff" stroke-width="7"/>
    <circle r="9" fill="#d1e0ee"/>
  </g>
</svg>
