name: Format planos PR branch
on:
  push:
    branches:
      - fix/planos-remove-card-photos-20261028
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:changed -- --base origin/main
      - name: Commit formatted source on isolated PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.js' '*.ts' '*.tsx' '*.mjs' '*.json' '*.md'
          if ! git diff --cached --quiet; then
            git commit -m "style: format card benefit changes"
            git push origin HEAD:fix/planos-remove-card-photos-20261028
          fi
