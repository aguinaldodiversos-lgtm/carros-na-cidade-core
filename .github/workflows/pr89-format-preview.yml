name: PR89 Formatting Preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Show Prettier-only changes
        run: |
          npx prettier --write src/modules/sale-requests/sale-requests.dealer.repository.js src/modules/sale-requests/sale-requests.dealer.service.js src/modules/sale-requests/sale-requests.selection.service.js tests/sale-requests/fake-db.js tests/sale-requests/sale-requests-dealer-feed.test.js tests/sale-requests/sale-requests-offer-selection.test.js
          git diff --unified=3 -- src/modules/sale-requests/sale-requests.dealer.repository.js src/modules/sale-requests/sale-requests.dealer.service.js src/modules/sale-requests/sale-requests.selection.service.js tests/sale-requests/fake-db.js tests/sale-requests/sale-requests-dealer-feed.test.js tests/sale-requests/sale-requests-offer-selection.test.js
