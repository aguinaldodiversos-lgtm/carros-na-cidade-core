name: Temporary Shadow Fast Path Load Test #2
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-shadow-fastpath-load.yml]
permissions:
  contents: write
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run 20 cycles / 80 accesses
        shell: bash
        run: |
          set -u
          mkdir -p tmp
          OUT=tmp/shadow-fastpath-raw.csv
          REPORT=tmp/shadow-fastpath-results.txt
          : > "$OUT"
          URLS=(
            "https://www.carrosnacidade.com/carros-em/braganca-paulista-sp"
            "https://www.carrosnacidade.com/carros-em/braganca-paulista-sp?q=onix"
            "https://www.carrosnacidade.com/carros-em/atibaia-sp"
            "https://www.carrosnacidade.com/carros-em/atibaia-sp?q=onix"
          )
          echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$REPORT"
          idx=0
          for cycle in $(seq 1 20); do
            for url in "${URLS[@]}"; do
              idx=$((idx+1))
              set +e
              meta="$(curl -L -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code},%{time_total}' "$url")"
              rc=$?
              set -e
              code="${meta%%,*}"; total="${meta#*,}"
              [ -z "$meta" ] && code=000 && total=30
              printf '%s,%s,%s,%s,%s\n' "$idx" "$cycle" "$code" "$total" "$rc" >> "$OUT"
            done
            [ "$cycle" -lt 20 ] && sleep 2
          done
          echo "END_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"
          python3 - <<'PY' >> "$REPORT"
          import csv, statistics, math
          rows=[]
          with open("tmp/shadow-fastpath-raw.csv") as f:
              for r in csv.reader(f):
                  rows.append(dict(idx=int(r[0]),cycle=int(r[1]),code=int(r[2]),t=float(r[3]),rc=int(r[4])))
          def pct(v,p):
              v=sorted(v); k=(len(v)-1)*p; lo=math.floor(k); hi=math.ceil(k)
              return v[lo] if lo==hi else v[lo]*(hi-k)+v[hi]*(k-lo)
          vals=[r["t"] for r in rows]; warm=[r["t"] for r in rows if r["cycle"]>1]
          print(f"TOTAL={len(rows)}")
          print(f"HTTP_200={sum(r['code']==200 for r in rows)}")
          print(f"CURL_FAILURES={sum(r['rc']!=0 for r in rows)}")
          print(f"HTTP_5XX={sum(500<=r['code']<=599 for r in rows)}")
          print(f"MEAN_MS={statistics.mean(vals)*1000:.1f}")
          print(f"P50_MS={pct(vals,.50)*1000:.1f}")
          print(f"P95_MS={pct(vals,.95)*1000:.1f}")
          print(f"WARM_MEAN_MS={statistics.mean(warm)*1000:.1f}")
          print(f"WARM_P95_MS={pct(warm,.95)*1000:.1f}")
          PY
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add tmp/shadow-fastpath-raw.csv tmp/shadow-fastpath-results.txt
          git commit -m "test: record temporary shadow fastpath load results"
          git push origin HEAD:main
