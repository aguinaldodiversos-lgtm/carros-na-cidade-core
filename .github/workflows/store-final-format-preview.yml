name: Store Final Formatting Preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Render Prettier diff for profile regression tests
        run: |
          npx prettier --write 'frontend/components/account/StoreProfileForm.test.tsx' 'src/modules/auth/auth.routes.js' 'tests/auth/verify-document-revokes-store.test.js'
          git diff --unified=3 -- 'frontend/components/account/StoreProfileForm.test.tsx' 'src/modules/auth/auth.routes.js' 'tests/auth/verify-document-revokes-store.test.js'
