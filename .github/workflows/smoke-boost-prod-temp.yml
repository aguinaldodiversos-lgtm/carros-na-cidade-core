name: One-time production boost smoke
on:
  push:
    branches:
      - fix/boost-card-429-internal-auth
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live boost API and four pricing cards
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 25 \
            'https://www.carrosnacidade.com/api/public/commercial/boost?verified=1&smoke=20261028-1749' > /tmp/boost.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/boost.json'))
          b=data.get('boost') or {}
          assert b.get('price_cents') == 3990, f"Unexpected price: {b.get('price_cents')}"
          assert b.get('duration_days') == 7, f"Unexpected duration: {b.get('duration_days')}"
          assert b.get('active') is True, "Boost not active"
          print('BOOST VERIFIED: 3990 cents, 7 days, active')
          PY
          curl --fail --silent --show-error --location --compressed --retry 2 --max-time 35 \
            'https://www.carrosnacidade.com/planos?smoke=20261028-1749' > /tmp/planos.html
          python3 - <<'PY'
          import re
          html=open('/tmp/planos.html', encoding='utf-8').read()
          ids=re.findall(r'data-plan-id="([^"]+)"', html)
          expected=['destaque-7-dias','lojista-pro','lojista-start','gratis']
          assert ids==expected, f'Unexpected four-card order: {ids}'
          assert 'R$ 39,90' in html or 'R$ 39,90' in html, 'Destaque price missing'
          print('PRICING PAGE VERIFIED: four cards in correct order, R$ 39,90')
          PY
