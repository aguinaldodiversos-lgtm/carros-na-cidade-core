name: Temporário - formatar teste dos cards
on:
  push:
    branches: [fix/compact-dealer-profile-cards-20261031]
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-dealer-profile-cards-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write "frontend/components/dealers/DealerStorefront.test.tsx"
      - name: Commitar formatação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "frontend/components/dealers/DealerStorefront.test.tsx"
          if ! git diff --cached --quiet; then
            git commit -m "style(lojas): formatar teste dos cards compactos"
            git push origin HEAD:fix/compact-dealer-profile-cards-20261031
          fi
