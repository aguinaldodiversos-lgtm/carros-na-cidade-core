name: Temporário - formatação do perfil público da loja
on:
  push:
    branches:
      - feat/perfil-publico-loja-mobile-20261030
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/perfil-publico-loja-mobile-20261030
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Formatar apenas os arquivos alterados
        run: |
          npx prettier --write \
            "frontend/app/api/account/store/media/route.ts" \
            "frontend/app/api/account/store/reviews/[id]/route.ts" \
            "frontend/app/api/public/dealers/[slug]/reviews/route.ts" \
            "frontend/components/account/StoreProfileForm.tsx" \
            "frontend/components/account/StoreReviewModeration.tsx" \
            "frontend/components/dealers/DealerStorefront.tsx" \
            "frontend/lib/account/dealer-review-bff.ts" \
            "src/modules/account/account.routes.js" \
            "src/modules/account/store-profile.service.js" \
            "src/modules/public/dealer-reviews.service.js" \
            "src/modules/public/public-dealer.service.js" \
            "src/modules/public/public.routes.js"
      - name: Commitar formatação sem tocar a branch principal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "frontend/app/api/account/store/media/route.ts" "frontend/app/api/account/store/reviews/[id]/route.ts" "frontend/app/api/public/dealers/[slug]/reviews/route.ts" "frontend/components/account/StoreProfileForm.tsx" "frontend/components/account/StoreReviewModeration.tsx" "frontend/components/dealers/DealerStorefront.tsx" "frontend/lib/account/dealer-review-bff.ts" "src/modules/account/account.routes.js" "src/modules/account/store-profile.service.js" "src/modules/public/dealer-reviews.service.js" "src/modules/public/public-dealer.service.js" "src/modules/public/public.routes.js"
          if ! git diff --cached --quiet; then
            git commit -m "style(lojas): aplicar prettier aos arquivos da PR"
            git push origin HEAD:feat/perfil-publico-loja-mobile-20261030
          fi
