name: Temporário - formatar card de loja do veículo
on:
  push:
    branches: [feat/vehicle-detail-dealer-cta-card-20261031]
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vehicle-detail-dealer-cta-card-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Formatar somente arquivos alterados
        run: |
          npx prettier --write "frontend/components/vehicle/detail/DealerStoreLinkCard.test.tsx" "frontend/components/vehicle/detail/DealerStoreLinkCard.tsx" "frontend/components/vehicle/detail/VehicleDetailView.tsx" "frontend/lib/ads/ad-detail.test.ts" "frontend/lib/vehicle/public-vehicle.test.ts"
      - name: Aplicar na branch de revisão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "frontend/components/vehicle/detail/DealerStoreLinkCard.test.tsx" "frontend/components/vehicle/detail/DealerStoreLinkCard.tsx" "frontend/components/vehicle/detail/VehicleDetailView.tsx" "frontend/lib/ads/ad-detail.test.ts" "frontend/lib/vehicle/public-vehicle.test.ts"
          if ! git diff --cached --quiet; then
            git commit -m "style(veiculo): padronizar card de loja e testes"
            git push origin HEAD:feat/vehicle-detail-dealer-cta-card-20261031
          fi
