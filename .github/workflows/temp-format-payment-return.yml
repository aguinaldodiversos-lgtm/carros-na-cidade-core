name: Temporário - formatar confirmação de pagamento
on:
  push:
    branches: [fix/payment-return-confirmation-20261031]
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-return-confirmation-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Formatar somente arquivos do pagamento
        run: |
          npx prettier --write "frontend/app/pagamento/sucesso/page.tsx" "frontend/app/pagamento/sucesso/page.test.tsx" "src/modules/payments/payments.return-status.service.js" "tests/payments/payment-return-status.test.js"
      - name: Commitar na branch de revisão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "frontend/app/pagamento/sucesso/page.tsx" "frontend/app/pagamento/sucesso/page.test.tsx" "src/modules/payments/payments.return-status.service.js" "tests/payments/payment-return-status.test.js"
          if ! git diff --cached --quiet; then
            git commit -m "style(pagamentos): formatar confirmação pós-checkout"
            git push origin HEAD:fix/payment-return-confirmation-20261031
          fi
