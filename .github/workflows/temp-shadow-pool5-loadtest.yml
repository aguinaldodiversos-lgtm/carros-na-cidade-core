name: TEMP Shadow Pool5 Load Test

on:
  push:
    branches:
      - "ops/shadow-pool5-loadtest-2026-09-22"

jobs:
  loadtest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Run 20 controlled browse/search cycles
        shell: bash
        run: |
          set -uo pipefail
          echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          urls=(
            'https://www.carrosnacidade.com/carros-em/braganca-paulista-sp'
            'https://www.carrosnacidade.com/carros-em/braganca-paulista-sp?q=onix&city_slug=braganca-paulista-sp'
            'https://www.carrosnacidade.com/carros-em/atibaia-sp'
            'https://www.carrosnacidade.com/carros-em/atibaia-sp?q=onix'
          )
          failures=0
          for i in $(seq 1 20); do
            echo "CYCLE=$i"
            for u in "${urls[@]}"; do
              if ! out=$(curl -L -sS --max-time 30 -A "$UA" -H 'Cache-Control: no-cache' -o /dev/null -w '%{http_code} %{time_total} %{url_effective}' "$u" 2>&1); then
                failures=$((failures+1))
              fi
              echo "$out"
              sleep 0.8
            done
            sleep 1.5
          done
          echo "END_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "CURL_FAILURES=$failures"
