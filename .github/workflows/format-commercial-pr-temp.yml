name: Format commercial PR branch
on:
  push:
    branches:
      - fix/comercial-planos-cards-admin-20261028
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:changed
      - name: Commit Prettier changes on isolated branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: format commercial PR files"
            git push origin HEAD:fix/comercial-planos-cards-admin-20261028
          fi
