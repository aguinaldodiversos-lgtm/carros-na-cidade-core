name: TEMP Format Shadow Tests

on:
  push:
    branches:
      - "f2.2/shadow-materialized-candidates-2026-09-22"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run project Prettier
        run: |
          npx prettier --write             tests/search-policy/d1-shadow-safety.integration.test.js             tests/search-policy/f2-engine.integration.test.js
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             tests/search-policy/d1-shadow-safety.integration.test.js             tests/search-policy/f2-engine.integration.test.js
          git commit -m "style(search): apply project Prettier exactly"
          git push origin "HEAD:${{ github.ref_name }}"
