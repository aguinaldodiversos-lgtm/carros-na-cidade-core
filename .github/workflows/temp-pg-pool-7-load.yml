name: Temporary PG Pool 7 Load Test

on:
  push:
    branches:
      - temp/pg-pool-7-load-20260922
    paths:
      - .github/workflows/temp-pg-pool-7-load.yml

permissions:
  contents: write

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/pg-pool-7-load-20260922

      - name: Run 20 cycles / 80 public accesses
        shell: bash
        run: |
          set -u
          mkdir -p tmp
          OUT="tmp/pg-pool-7-raw.csv"
          REPORT="tmp/pg-pool-7-results.txt"
          : > "$OUT"

          URLS=(
            "https://www.carrosnacidade.com/carros-em/braganca-paulista-sp"
            "https://www.carrosnacidade.com/carros-em/braganca-paulista-sp?q=onix"
            "https://www.carrosnacidade.com/carros-em/atibaia-sp"
            "https://www.carrosnacidade.com/carros-em/atibaia-sp?q=onix"
          )

          START_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "START_UTC=$START_UTC" > "$REPORT"

          idx=0
          for cycle in $(seq 1 20); do
            for url in "${URLS[@]}"; do
              idx=$((idx+1))
              tmp_body="$(mktemp)"
              set +e
              meta="$(curl -L -sS --connect-timeout 10 --max-time 30 -o "$tmp_body" -w '%{http_code},%{time_total}' "$url")"
              rc=$?
              set -e
              rm -f "$tmp_body"
              code="${meta%%,*}"
              total="${meta#*,}"
              if [ -z "$meta" ]; then
                code="000"
                total="30"
              fi
              printf '%s,%s,%s,%s,%s\n' "$idx" "$cycle" "$code" "$total" "$rc" >> "$OUT"
            done
            if [ "$cycle" -lt 20 ]; then
              sleep 2
            fi
          done

          END_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "END_UTC=$END_UTC" >> "$REPORT"

          python3 - <<'PY' >> "$REPORT"
          import csv, statistics, math
          rows=[]
          with open("tmp/pg-pool-7-raw.csv", newline="") as f:
              for r in csv.reader(f):
                  idx, cycle, code, total, rc = r
                  rows.append({
                      "idx": int(idx), "cycle": int(cycle), "code": int(code),
                      "t": float(total), "rc": int(rc)
                  })
          def pct(vals, p):
              vals=sorted(vals)
              if not vals:
                  return float("nan")
              k=(len(vals)-1)*p
              f=math.floor(k); c=math.ceil(k)
              if f==c: return vals[int(k)]
              return vals[f]*(c-k)+vals[c]*(k-f)
          vals=[r["t"] for r in rows]
          warm=[r["t"] for r in rows if r["cycle"]>1]
          print(f"TOTAL={len(rows)}")
          print(f"HTTP_200={sum(r['code']==200 for r in rows)}")
          print(f"CURL_FAILURES={sum(r['rc']!=0 for r in rows)}")
          print(f"HTTP_5XX={sum(500 <= r['code'] <= 599 for r in rows)}")
          print(f"MEAN_MS={statistics.mean(vals)*1000:.1f}")
          print(f"P50_MS={pct(vals,0.50)*1000:.1f}")
          print(f"P95_MS={pct(vals,0.95)*1000:.1f}")
          print(f"WARM_MEAN_MS={statistics.mean(warm)*1000:.1f}")
          print(f"WARM_P95_MS={pct(warm,0.95)*1000:.1f}")
          print("STATUS_COUNTS="+",".join(f"{c}:{sum(r['code']==c for r in rows)}" for c in sorted(set(r["code"] for r in rows))))
          print("RAW_LATENCIES_MS="+",".join(f"{r['t']*1000:.1f}" for r in rows))
          PY

      - name: Commit result to temporary branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/pg-pool-7-raw.csv tmp/pg-pool-7-results.txt
          git commit -m "test: record temporary pg pool 7 load results"
          git push origin HEAD:temp/pg-pool-7-load-20260922
