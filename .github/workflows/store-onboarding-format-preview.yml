name: Store Onboarding Formatting Preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write 'frontend/app/admin/anunciantes/[id]/page.tsx' 'frontend/components/account/StoreProfileForm.tsx' 'frontend/lib/admin/api.ts' 'src/modules/account/account.routes.js' 'src/modules/account/store-profile.service.js' 'src/modules/admin/admin.routes.js' 'src/modules/admin/advertisers/admin-advertisers.repository.js' 'tests/account/store-onboarding.test.js' 'tests/admin/store-verification.test.js'
          git diff --unified=3 -- 'frontend/app/admin/anunciantes/[id]/page.tsx' 'frontend/components/account/StoreProfileForm.tsx' 'frontend/lib/admin/api.ts' 'src/modules/account/account.routes.js' 'src/modules/account/store-profile.service.js' 'src/modules/admin/admin.routes.js' 'src/modules/admin/advertisers/admin-advertisers.repository.js' 'tests/account/store-onboarding.test.js' 'tests/admin/store-verification.test.js'
