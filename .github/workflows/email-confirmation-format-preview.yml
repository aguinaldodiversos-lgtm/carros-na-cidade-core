name: Email Confirmation Formatting Preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Print canonical diff
        run: |
          npx prettier --write 'frontend/app/admin/anunciantes/[id]/page.tsx' 'frontend/app/api/auth/verify-email/route.ts' 'frontend/components/account/StoreProfileForm.tsx' 'frontend/components/auth/ConfirmEmailPanel.tsx' 'src/modules/auth/auth.routes.js' 'src/modules/auth/emailVerification.service.js' 'src/services/email.service.js' 'tests/auth/email-confirmation.test.js'
          git diff --unified=3 -- 'frontend/app/admin/anunciantes/[id]/page.tsx' 'frontend/app/api/auth/verify-email/route.ts' 'frontend/components/account/StoreProfileForm.tsx' 'frontend/components/auth/ConfirmEmailPanel.tsx' 'src/modules/auth/auth.routes.js' 'src/modules/auth/emailVerification.service.js' 'src/services/email.service.js' 'tests/auth/email-confirmation.test.js'
