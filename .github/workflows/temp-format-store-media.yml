name: Temporário - formatar upload de loja
on:
  push:
    branches: [fix/store-media-backend-r2-20261031]
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/store-media-backend-r2-20261031
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Formatar apenas os arquivos da correção
        run: |
          npx prettier --write "frontend/app/api/account/store/media/route.ts" "src/modules/account/account.routes.js" "src/modules/account/store-media.service.js"
      - name: Commitar na branch, nunca main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "frontend/app/api/account/store/media/route.ts" "src/modules/account/account.routes.js" "src/modules/account/store-media.service.js"
          if ! git diff --cached --quiet; then
            git commit -m "style(lojas): padronizar upload da loja"
            git push origin HEAD:fix/store-media-backend-r2-20261031
          fi
